[project]
name = "scale-app"
version = "0.1.0"
description = "SCALE — AI-Powered Financial Intelligence"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
testpaths = [
    "apps",
    "packages",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
