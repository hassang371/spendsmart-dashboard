name: Build Base Image

# Rebuilds the heavy-deps base image only when Python dependencies change.
# The resulting buildcache tag in GHCR is reused by every CI run, so
# code-only commits skip the 25-min pip install entirely.
on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - Dockerfile
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache builder stage
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: .
          target: api
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/scale-api:base-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/scale-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/scale-api:buildcache,mode=max
