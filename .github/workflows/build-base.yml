name: Build Base Image

# Rebuilds the heavy-deps base image only when Python dependencies change.
# The resulting buildcache tag in GHCR is reused by every CI run, so
# code-only commits skip the 25-min pip install entirely.
on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - Dockerfile
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache builder stage
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          target: api
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/scale-api:base-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/scale-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/scale-api:buildcache,mode=max
