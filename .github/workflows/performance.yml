name: Performance Testing

on:
  schedule:
    # Run once a week on Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to test against"
        required: true
        default: "https://staging-api.scalefinance.dev"

jobs:
  load-test:
    name: Run k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run local test server (if default)
        if: ${{ inputs.target_url == '' || github.event_name == 'schedule' }}
        run: |
          docker compose up -d redis api
          # BUG-028 fix: Poll health endpoint instead of blind sleep.
          # Retries up to 30 times (60 seconds max) before failing.
          echo "Waiting for API to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health/ready; then
              echo "API is ready after ${i} attempts."
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API did not become ready within 60 seconds. Aborting."
              exit 1
            fi
            sleep 2
          done
          API_URL=http://localhost:8000 k6 run tests/performance/load_test.js

      - name: Run remote test
        if: ${{ inputs.target_url != '' && github.event_name == 'workflow_dispatch' }}
        run: |
          API_URL=${{ inputs.target_url }} k6 run tests/performance/load_test.js
