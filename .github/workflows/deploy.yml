name: Deploy

# BUG-001 fix: Trigger ONLY when CI workflow completes successfully.
# This replaces the fake echo-only wait-for-ci job that never verified anything.
# The deploy will NOT run if any CI job fails.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions
permissions:
  contents: read

jobs:
  # Real CI gate: abort immediately if the triggering CI run did not succeed
  check-ci-success:
    runs-on: ubuntu-latest
    steps:
      - name: Abort if CI did not succeed
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI workflow concluded with: ${{ github.event.workflow_run.conclusion }}"
          echo "Aborting deployment — CI must pass before deploying."
          exit 1
      - name: CI passed — proceeding
        run: echo "CI succeeded (run ${{ github.event.workflow_run.id }}). Proceeding to deploy."

  deploy-staging:
    name: Deploy to Staging
    needs: [check-ci-success]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.api.scale-app.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # TODO: Configure deployment target.
      # Option A — SSH + Docker Compose on a VPS:
      #   - Add SSH_KEY, STAGING_HOST, STAGING_USER to GitHub Secrets
      #   - Uncomment and adapt the steps below
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.SSH_KEY }}
      #     script: |
      #       cd /opt/scale-app
      #       git pull origin main
      #       docker compose pull
      #       docker compose up -d --build
      #
      # Option B — PaaS (Render / Fly.io / Railway):
      #   - Use the platform's official GitHub Action and add the deploy key to Secrets
      - name: Deploy to Staging
        run: echo "TODO — configure deployment target (see comments above)."

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    runs-on: ubuntu-latest

    # Requires an Environment Protection Rule in GitHub Settings → Environments → production:
    # "Required reviewers" — deployment will pause until a reviewer approves.
    environment:
      name: production
      url: https://api.scale-app.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # TODO: Mirror staging deployment steps here, pointing at production secrets.
      - name: Deploy to Production
        run: echo "TODO — configure deployment target (see comments above)."
