name: Deploy

on:
  push:
    branches: [main]

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The CI workflow will also run on push to main (defined in ci.yml)
  # But we run a lightweight wait-for-ci job here to ensure it passes before deploying
  # Waits for the CI workflow (ci.yml) to succeed on the same commit before deploying.
  # Requires: Settings → Actions → General → "Require status checks to pass" with "CI" selected.
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm CI passed
        run: echo "CI passed — proceeding to deploy."

  deploy-staging:
    name: Deploy to Staging
    needs: [wait-for-ci]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.api.scale-app.com

    steps:
      - uses: actions/checkout@v4

      # TODO: Configure deployment target.
