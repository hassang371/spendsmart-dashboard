name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: 'Full commit SHA to deploy (bypasses CI gate — debugging only)'
        required: false
        type: string
        default: ''
      rollback_sha:
        description: 'Image SHA to rollback to (leave empty for normal deploy)'
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-ci-success:
    name: Check CI passed
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    timeout-minutes: 5
    steps:
      - name: Abort if CI did not succeed
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI workflow concluded with: ${{ github.event.workflow_run.conclusion }}"
          echo "Aborting deployment — CI must pass before deploying."
          exit 1
      - name: CI passed — proceeding
        run: echo "CI succeeded (run ${{ github.event.workflow_run.id }}). Proceeding to deploy."

  run-migrations:
    name: Run DB Migrations
    needs: [check-ci-success]
    runs-on: ubuntu-latest
    if: always() && ((github.event_name == 'workflow_run' && needs.check-ci-success.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.deploy_sha != '' && inputs.rollback_sha == ''))
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.deploy_sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: supabase db push --db-url "$DATABASE_URL"

  deploy-staging:
    name: Deploy to Staging
    needs: [run-migrations]
    runs-on: ubuntu-latest
    if: always() && needs.run-migrations.result == 'success' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.deploy_sha != '' && inputs.rollback_sha == ''))
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set deploy SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.deploy_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists in GHCR
        run: docker manifest inspect ghcr.io/${{ github.repository_owner }}/scale-api:${{ steps.sha.outputs.value }}

      - name: Deploy to Railway (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/scale-api:${{ steps.sha.outputs.value }}
          API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
          WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          ENV_ID: ${{ vars.RAILWAY_STAGING_ENV_ID }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os, sys

          token = os.environ['RAILWAY_TOKEN']
          image = os.environ['IMAGE']
          api_id = os.environ['API_SERVICE_ID']
          worker_id = os.environ['WORKER_SERVICE_ID']
          env_id = os.environ['ENV_ID']

          def railway_gql(query, variables=None):
              data = json.dumps({'query': query, 'variables': variables or {}}).encode()
              req = urllib.request.Request(
                  'https://backboard.railway.app/graphql/v2',
                  data=data,
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req) as r:
                  result = json.loads(r.read())
              if result.get('errors'):
                  print(f"GraphQL errors: {result['errors']}", file=sys.stderr)
                  sys.exit(1)
              return result

          for svc_name, svc_id in [('scale-api', api_id), ('scale-worker', worker_id)]:
              print(f"Updating {svc_name} → {image}")
              railway_gql(
                  'mutation($id: String!, $env: String!, $inp: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $id, environmentId: $env, input: $inp) }',
                  {'id': svc_id, 'env': env_id, 'inp': {'source': {'image': image}}}
              )
              print(f"Triggering deploy for {svc_name}...")
              railway_gql(
                  'mutation($id: String!, $env: String!) { serviceInstanceDeploy(serviceId: $id, environmentId: $env) }',
                  {'id': svc_id, 'env': env_id}
              )
          print("Staging deploy triggered.")
          PYEOF

  smoke-test-staging:
    name: Smoke Test Staging
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: always() && needs.deploy-staging.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Wait for health
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.STAGING_API_URL }}/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s"
            sleep 10
          done
          echo "Health check failed after 180s"
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: [smoke-test-staging, run-migrations]
    runs-on: ubuntu-latest
    if: always() && needs.smoke-test-staging.result == 'success' && needs.run-migrations.result == 'success' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.deploy_sha != '' && inputs.rollback_sha == ''))
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set deploy SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.deploy_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Railway (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/scale-api:${{ steps.sha.outputs.value }}
          API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
          WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          ENV_ID: ${{ vars.RAILWAY_PRODUCTION_ENV_ID }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os, sys

          token = os.environ['RAILWAY_TOKEN']
          image = os.environ['IMAGE']
          api_id = os.environ['API_SERVICE_ID']
          worker_id = os.environ['WORKER_SERVICE_ID']
          env_id = os.environ['ENV_ID']

          def railway_gql(query, variables=None):
              data = json.dumps({'query': query, 'variables': variables or {}}).encode()
              req = urllib.request.Request(
                  'https://backboard.railway.app/graphql/v2',
                  data=data,
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req) as r:
                  result = json.loads(r.read())
              if result.get('errors'):
                  print(f"GraphQL errors: {result['errors']}", file=sys.stderr)
                  sys.exit(1)
              return result

          for svc_name, svc_id in [('scale-api', api_id), ('scale-worker', worker_id)]:
              print(f"Updating {svc_name} → {image}")
              railway_gql(
                  'mutation($id: String!, $env: String!, $inp: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $id, environmentId: $env, input: $inp) }',
                  {'id': svc_id, 'env': env_id, 'inp': {'source': {'image': image}}}
              )
              print(f"Triggering deploy for {svc_name}...")
              railway_gql(
                  'mutation($id: String!, $env: String!) { serviceInstanceDeploy(serviceId: $id, environmentId: $env) }',
                  {'id': svc_id, 'env': env_id}
              )
          print("Production deploy triggered.")
          PYEOF

  smoke-test-production:
    name: Smoke Test Production
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: always() && needs.deploy-production.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Wait for health
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.PRODUCTION_API_URL }}/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s"
            sleep 10
          done
          echo "Health check failed after 180s"
          exit 1

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify rollback image exists
        run: docker manifest inspect ghcr.io/${{ github.repository_owner }}/scale-api:${{ inputs.rollback_sha }}

      - name: Rollback via Railway API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/scale-api:${{ inputs.rollback_sha }}
          API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
          WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          ENV_ID: ${{ vars.RAILWAY_PRODUCTION_ENV_ID }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os, sys

          token = os.environ['RAILWAY_TOKEN']
          image = os.environ['IMAGE']
          api_id = os.environ['API_SERVICE_ID']
          worker_id = os.environ['WORKER_SERVICE_ID']
          env_id = os.environ['ENV_ID']

          def railway_gql(query, variables=None):
              data = json.dumps({'query': query, 'variables': variables or {}}).encode()
              req = urllib.request.Request(
                  'https://backboard.railway.app/graphql/v2',
                  data=data,
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req) as r:
                  result = json.loads(r.read())
              if result.get('errors'):
                  print(f"GraphQL errors: {result['errors']}", file=sys.stderr)
                  sys.exit(1)
              return result

          for svc_name, svc_id in [('scale-api', api_id), ('scale-worker', worker_id)]:
              print(f"Rolling back {svc_name} → {image}")
              railway_gql(
                  'mutation($id: String!, $env: String!, $inp: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $id, environmentId: $env, input: $inp) }',
                  {'id': svc_id, 'env': env_id, 'inp': {'source': {'image': image}}}
              )
              railway_gql(
                  'mutation($id: String!, $env: String!) { serviceInstanceDeploy(serviceId: $id, environmentId: $env) }',
                  {'id': svc_id, 'env': env_id}
              )
          print("Rollback triggered.")
          PYEOF

      - name: Verify rollback health
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.PRODUCTION_API_URL }}/health)
            if [ "$STATUS" = "200" ]; then
              echo "Rollback health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s"
            sleep 10
          done
          echo "Rollback health check failed after 180s"
          exit 1
