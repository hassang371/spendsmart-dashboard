repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        args: [--multi]
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional@20.5.0']

  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Lint (Next.js)
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
        stages: [pre-commit]
      - id: frontend-typecheck
        name: Frontend TypeScript Check
        entry: bash -c 'cd apps/web && npx tsc --noEmit'
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [pre-commit]
      - id: prettier-check
        name: Prettier Format Check
        entry: bash -c 'cd apps/web && npx prettier --check .'
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json]
        pass_filenames: false
        stages: [pre-commit]
      - id: check-refs
        name: Check Refs line on fix/feat commits
        entry: bash scripts/check-refs.sh
        language: system
        stages: [commit-msg]
